    var ho = Math.min(c.trai.gt, c.gai.gt), nx = el('ul', 'nhan-xet');
    [['tien', c.tien.gt >= NGAN_SACH * 0.55 ? 'Ví vẫn dày, còn dư cho trăng mật.' : c.tien.gt >= NGAN_SACH * 0.3 ? 'Chi tiêu vừa tay.' : 'Ví mỏng rồi, nhớ đếm phong bì.'],
      ['nha', ho >= 72 ? 'Hai họ nở mày nở mặt.' : ho >= 60 ? 'Hai họ hài lòng.' : 'Nhà gái còn hơi tiếc phần trang trí.'],
      ['lua', c.cang.gt >= 50 ? 'Hơi căng, nhớ nghỉ ngơi trước ngày cưới.' : 'Tinh thần thoải mái.']].forEach(function (a) { var li = el('li'); li.innerHTML = ico(a[0]) + '<span></span>'; li.lastChild.textContent = a[1]; nx.appendChild(li); });
    than.appendChild(nx);
    than.appendChild(el('p', 'ghi', 'Bản thử: chỉ số và giá là số tạm, chưa phải luật chơi thật.'));
  }
  function bangMoDau(dau, than) {
    var m = el('div', 'mo-dau'); m.appendChild(el('div', 'nho', 'Bản chơi thử'));
    var h = el('h1'); h.appendChild(document.createTextNode('Về chung ')); h.appendChild(el('em', '', 'một nhà')); m.appendChild(h);
    m.appendChild(el('p', '', 'Dựng đám cưới của riêng bạn: từ dáng người, mái tóc, tà áo, tới nơi tổ chức và từng nhành hoa trên cổng.'));
    var ul = el('ul', 'viec');
    [['doi', 'Tạo cô dâu chú rể', 'Chiều cao, vóc dáng, gương mặt, tóc, trang phục'], ['ghim', 'Chọn nơi tổ chức', 'Đồi thông, phố cổ, bãi biển, sân nhà quê'], ['hoa', 'Trang trí vừa túi tiền', 'Giữ lòng hai họ mà không cháy ví']].forEach(function (a) {
      var li = el('li'); li.innerHTML = '<span class="vong">' + ico(a[0]) + '</span><span><b></b><span></span></span>'; li.querySelector('b').textContent = a[1]; li.lastChild.lastChild.textContent = a[2]; ul.appendChild(li); });
    m.appendChild(ul); than.appendChild(m);
  }
  function nutBam(chu, fn, phu, icoTruoc, icoSau) {
    var b = el('button', 'nut' + (phu ? ' phu' : ' to')); b.type = 'button'; b.innerHTML = (icoTruoc ? ico(icoTruoc) : '') + '<span></span>' + (icoSau ? ico(icoSau) : ''); b.querySelector('span').textContent = chu; b.addEventListener('click', fn); return b;
  }
  function dungBang(giuCuon) {
    var dau = $('bang-dau'), than = $('bang-than'), chan = $('bang-chan'), cuon = than.scrollTop;
    dau.innerHTML = ''; than.innerHTML = ''; chan.innerHTML = ''; the = []; khac = [];
    app.classList.toggle('can-mat', gan && (st.tab === 'mat' || st.tab === 'toc'));
    if (st.buoc === 0) { bangMoDau(dau, than); chan.appendChild(nutBam('Bắt đầu', function () { sang(1); }, 0, null, 'phai')); }
    else if (st.buoc === 1) { bangCapDoi(dau, than); chan.appendChild(nutBam('Về đầu', function () { sang(0); }, 1, 'trai')); chan.appendChild(nutBam('Chọn nơi tổ chức', function () { sang(2); }, 0, null, 'phai')); }
    else if (st.buoc === 2) { bangDiaDiem(dau, than); chan.appendChild(nutBam('Cặp đôi', function () { sang(1); }, 1, 'trai')); chan.appendChild(nutBam('Trang trí', function () { sang(3); }, 0, null, 'phai')); }
    else if (st.buoc === 3) { bangTrangTri(dau, than); chan.appendChild(nutBam('Địa điểm', function () { sang(2); }, 1, 'trai')); chan.appendChild(nutBam('Tới ngày cưới', function () { sang(4); }, 0, null, 'phai')); }
    else { bangNgayCuoi(dau, than); chan.appendChild(nutBam('Sửa lại', function () { sang(1); }, 1, 'trai')); chan.appendChild(nutBam('Chơi lại từ đầu', function () { var b = moi(); st = b; truoc = null; dung(); ghi(); }, 0, 'lai')); }
    capNhat(); if (giuCuon) than.scrollTop = cuon;
  }

  /* ---------- dựng theo bước ---------- */
  var henNet = 0;
  function dung() {
    gan = st.buoc === 1; app.dataset.buoc = st.buoc; app.classList.toggle('gan', gan);
    veBuoc(); datNen(); dungBang(); veChiSo(); boCuc();
    datPV(); veDoi(); veHuy(); if (gan) veChonAi();
    clearTimeout(henNet); if (!gan) henNet = setTimeout(veDoi, giamDong ? 0 : 680); // lùi xa xong thì vẽ lại ở cỡ nhỏ cho nét
    roiHoa();
  }
  var henCo = 0;
  window.addEventListener('resize', function () { clearTimeout(henCo); henCo = setTimeout(function () { boCuc(); veHet(); }, 80); });
  dung();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { boCuc(); veHet(); });
  // Khi cặp đôi đã hiện đủ nét lần đầu: lúc rảnh thì tải sẵn tấm hình nhỏ cho thẻ chọn và tranh nền nét cho cảnh phóng gần,
  // để bấm "Bắt đầu" là có ngay mà không tranh đường truyền với cặp đôi lúc mới mở trang.
  var daTai = false;
  function daVe() {
    if (daTai) return; daTai = true;
    (window.requestIdleCallback || function (f) { setTimeout(f, 300); })(function () {
      NV.taiTruoc(st.ai === 'chu-re' ? ['nam', 'nu'] : ['nu', 'nam']);
      if (canNho()) { var i = new Image(); i.src = anhNen(st.dd, st.tt); }
    }, { timeout: 1500 });
  }
  if (st.buoc === 1) NV.taiTruoc(st.ai === 'chu-re' ? ['nam', 'nu'] : ['nu', 'nam']); // mở lại ngay ở bước tạo nhân vật: cần thẻ hình ngay
})();
</script>
