<style>
/* Phong cách "Vườn kính" của trang chủ Timeless Harmony: cảnh cưới là nền của cả trang (bản đã làm mờ, đứng yên),
   mọi nội dung nằm trong kính. TẤM = bảng màn chơi; THẺ = lựa chọn bên trong; GIỌT = thanh trên cùng, nút, nhãn.
   Ô sân khấu là cửa sổ nét nhìn vào cảnh, có máy quay phóng gần hoặc lùi xa.
   Điện thoại: sân khấu trên, tấm kính dưới. Máy tính: sân khấu trái, tấm kính phải.
   Nền mờ là ảnh tĩnh nên không dùng backdrop-filter trên tấm lớn (nhẹ máy, giống "kính dựng sẵn" của trang chủ). */
:root {
  --dat: #DCE9E4; --muc: #12261C; --muc2: #2B4336; --muc3: #40574A;
  --ngoc: #1E5A40; --dong: #765225; --champagne: #C7A262;
  --tam: linear-gradient(135deg, rgba(255,255,255,.86), rgba(255,255,255,.76) 48%, rgba(255,255,255,.8));
  --vanh: inset 0 0 0 1px rgba(255,255,255,.5), inset 0 1.5px 0 rgba(255,255,255,.98), inset 0 -1px 0 rgba(255,255,255,.55), inset 0 18px 28px -18px rgba(255,255,255,.95), inset 0 -18px 28px -20px rgba(255,255,255,.6);
  --bong-tam: 0 36px 70px -32px rgba(18,44,66,.46), 0 3px 8px rgba(18,44,66,.06);
  --the: linear-gradient(135deg, rgba(255,255,255,.62), rgba(255,255,255,.38)); --the-vien: rgba(255,255,255,.8);
  --bong-the: 0 14px 30px -18px rgba(18,44,66,.32), inset 0 1px 0 rgba(255,255,255,.95);
  --nut: linear-gradient(180deg, rgba(40,104,76,.96) 0%, rgba(14,50,36,.98) 100%); --nut-vien: rgba(231,207,155,.5); --nut-chu: #FBF7EE;
  --bong-nut: 0 16px 28px -14px rgba(12,46,32,.7), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -10px 16px -10px rgba(0,0,0,.35), inset 0 10px 14px -10px rgba(255,255,255,.3);
  --giot: linear-gradient(135deg, rgba(255,255,255,.9), rgba(255,255,255,.78));
  --ke: rgba(18,38,28,.11); --ke2: rgba(18,38,28,.2);
  --nhan: #765225; --nhan-nen: rgba(199,162,98,.18); --nhan-vien: rgba(122,86,40,.32);
  --anh-vang: linear-gradient(100deg, #7A5A2B 0%, #C7A262 46%, #8A6534 100%);
  --o: rgba(255,255,255,.76); --khay: #FBFAF5; --tot: #1E5A40; --xau: #A8281F; --dau-do: #B3261E; --giay: rgba(255,253,246,.9);
  --m-tien: #765225; --m-tinh: #A8504A; --m-trai: #1E5A40; --m-gai: #2A7780; --m-cang: #A8281F;
  --loc-nen: blur(22px) saturate(1.3) contrast(.62) brightness(1.24);
  --tieu-de: 'Cormorant Garamond', Georgia, 'Times New Roman', serif; --than: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', sans-serif; --em: cubic-bezier(.3, .7, .2, 1); --nay: cubic-bezier(.2, 1.4, .4, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --dat: #07111F; --muc: #F3F5F1; --muc2: #D5DED8; --muc3: #AFC0B7;
  --tam: linear-gradient(135deg, rgba(16,32,46,.82), rgba(8,20,32,.72) 50%, rgba(14,28,42,.78));
  --vanh: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 1.5px 0 rgba(255,255,255,.34), inset 0 -1px 0 rgba(255,255,255,.1);
  --bong-tam: 0 34px 70px -30px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.25);
  --the: linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.05)); --the-vien: rgba(255,255,255,.15); --bong-the: 0 14px 30px -18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14);
  --nut: linear-gradient(180deg, #F6E9C6 0%, #D8BA7A 100%); --nut-vien: rgba(255,255,255,.55); --nut-chu: #1B2A1F;
  --bong-nut: 0 14px 26px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -8px 14px -8px rgba(122,86,40,.5);
  --giot: linear-gradient(135deg, rgba(20,38,54,.9), rgba(10,22,34,.82));
  --ke: rgba(255,255,255,.12); --ke2: rgba(255,255,255,.22);
  --nhan: #E7CF9B; --nhan-nen: rgba(231,207,155,.12); --nhan-vien: rgba(231,207,155,.32);
  --anh-vang: linear-gradient(100deg, #F6EBCB, #D8BA7A 50%, #F3E2B4);
  --o: rgba(10,22,34,.7); --khay: #18293A; --tot: #A9DDB8; --xau: #FF9A8A; --dau-do: #FF9A8A; --giay: rgba(255,255,255,.06);
  --m-tien: #E7CF9B; --m-tinh: #F0A49A; --m-trai: #A9DDB8; --m-gai: #9AD3D9; --m-cang: #FF9A8A;
  --loc-nen: blur(22px) saturate(1.25) brightness(.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --dat: #07111F; --muc: #F3F5F1; --muc2: #D5DED8; --muc3: #AFC0B7;
  --tam: linear-gradient(135deg, rgba(16,32,46,.82), rgba(8,20,32,.72) 50%, rgba(14,28,42,.78));
  --vanh: inset 0 0 0 1px rgba(255,255,255,.12), inset 0 1.5px 0 rgba(255,255,255,.34), inset 0 -1px 0 rgba(255,255,255,.1);
  --bong-tam: 0 34px 70px -30px rgba(0,0,0,.7), 0 2px 6px rgba(0,0,0,.25);
  --the: linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.05)); --the-vien: rgba(255,255,255,.15); --bong-the: 0 14px 30px -18px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.14);
  --nut: linear-gradient(180deg, #F6E9C6 0%, #D8BA7A 100%); --nut-vien: rgba(255,255,255,.55); --nut-chu: #1B2A1F;
  --bong-nut: 0 14px 26px -12px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.8), inset 0 -8px 14px -8px rgba(122,86,40,.5);
  --giot: linear-gradient(135deg, rgba(20,38,54,.9), rgba(10,22,34,.82));
  --ke: rgba(255,255,255,.12); --ke2: rgba(255,255,255,.22);
  --nhan: #E7CF9B; --nhan-nen: rgba(231,207,155,.12); --nhan-vien: rgba(231,207,155,.32);
  --anh-vang: linear-gradient(100deg, #F6EBCB, #D8BA7A 50%, #F3E2B4);
  --o: rgba(10,22,34,.7); --khay: #18293A; --tot: #A9DDB8; --xau: #FF9A8A; --dau-do: #FF9A8A; --giay: rgba(255,255,255,.06);
  --m-tien: #E7CF9B; --m-tinh: #F0A49A; --m-trai: #A9DDB8; --m-gai: #9AD3D9; --m-cang: #FF9A8A;
  --loc-nen: blur(22px) saturate(1.25) brightness(.5); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--dat); color: var(--muc); font: 14px/1.5 var(--than); }
button { font: inherit; color: inherit; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--champagne); outline-offset: 2px; }
em { font-style: italic; font-family: var(--tieu-de); background: var(--anh-vang); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: .06em; }

/* Nền của cả trang: cảnh đang chọn, đã làm mờ, đứng yên */
.nen-trang { position: fixed; inset: 0; overflow: hidden; z-index: 0; pointer-events: none; }
.nen-trang i { position: absolute; inset: -48px; background: center / cover no-repeat; filter: var(--loc-nen); opacity: 0; }
.nen-trang i.hien { opacity: 1; }
@media (prefers-reduced-motion: no-preference) { .nen-trang i { transition: opacity .7s ease; } }

.app { position: relative; z-index: 1; box-sizing: border-box; height: 100%; min-height: 620px; max-width: 1380px; margin: 0 auto; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 10px;
  padding-block: 10px 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.trai { display: contents; }
.hud { grid-row: 1; } .san { grid-row: 2; } .chiso { grid-row: 3; } .bang { grid-row: 4; }
@media (min-width: 900px) {
  .app { grid-template-columns: minmax(0, 1.45fr) minmax(380px, 1fr); grid-template-rows: auto minmax(0, 1fr); column-gap: 18px; padding-block: 14px 16px; }
  .hud { grid-column: 1 / -1; }
  .trai { grid-row: 2; grid-column: 1; display: flex; flex-direction: column; gap: 12px; min-height: 0; min-width: 0; }
  .bang { grid-row: 2; grid-column: 2; }
}

/* GIỌT: viên nang kính */
.giot { background: var(--giot); box-shadow: 0 18px 34px -22px rgba(18,44,66,.5), var(--vanh); border-radius: 999px; }

/* Thanh trên cùng */
.hud { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ten-game { display: none; font-family: var(--tieu-de); font-size: 1.55rem; font-weight: 700; white-space: nowrap; line-height: 1; padding: 9px 18px 10px; }
@media (min-width: 900px) { .ten-game { display: block; } }
.tien-do { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 14px; min-height: 40px; }
.tien-do .chuong { font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--nhan); white-space: nowrap; }
.tien-do .man-ten { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.buoc { list-style: none; margin: 0 0 0 auto; padding: 0; display: flex; align-items: center; gap: 5px; flex: none; }
.buoc button { display: block; width: 10px; height: 10px; padding: 0; border-radius: 50%; border: 1.5px solid var(--ke2); background: transparent; cursor: pointer; position: relative; }
.buoc button::after { content: ""; position: absolute; inset: -9px -3px; }
.buoc button:disabled { cursor: default; }
.buoc .qua button { background: var(--champagne); border-color: var(--champagne); }
.buoc [aria-current="step"] { width: 26px; border-radius: 6px; background: var(--m-trai); border-color: var(--m-trai); }
.vi { display: inline-flex; align-items: center; gap: 7px; padding: 5px 14px 5px 6px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; min-height: 40px; box-sizing: border-box; }
.vi .xu { width: 28px; height: 28px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #F6DFA8, #C7A262 70%); display: grid; place-items: center; color: #5A3E12; font-size: .78rem; font-weight: 700; box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 2px 4px rgba(90,62,18,.3); }
.vi small { font-weight: 400; color: var(--muc3); }
@media (prefers-reduced-motion: no-preference) { .vi.nay { animation: nay .4s var(--nay); } }
@keyframes nay { 40% { transform: scale(1.1); } }

/* Sân khấu: cửa sổ nét nhìn vào cảnh */
.san { position: relative; overflow: hidden; border-radius: 26px; background: #CFE3E6; box-shadow: var(--bong-tam); height: 200px; min-width: 0; }
.san::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.6), inset 0 2px 0 rgba(255,255,255,.75); pointer-events: none; }
.world { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 2736 / 1520; transform-origin: 0 0; will-change: transform; contain: layout style; }
@media (prefers-reduced-motion: no-preference) { .san { transition: height .6s var(--em); } .world { transition: transform .6s var(--em); } .world .nen { transition: opacity .45s ease; } }
.world .nen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; max-width: none; }
.world .nen.hien { opacity: 1; }
.lop { position: absolute; pointer-events: none; }
.lop img, .lop canvas { display: block; width: 100%; height: 100%; max-width: none; }
.lop.lat canvas { transform: scaleX(-1); }
.lop.an { opacity: 0; }
.den { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.can-canh { position: absolute; inset: 0; background: var(--the); }
.can-canh canvas { display: block; width: 100%; height: 100%; object-fit: cover; }
.can-canh.an { opacity: 0; visibility: hidden; }
.luu-y { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.luu-y li { position: relative; padding: 7px 10px 7px 30px; border-radius: 12px; background: var(--the); border: 1px solid var(--the-vien); font-size: .8rem; color: var(--muc2); }
.luu-y li::before { content: "!"; position: absolute; left: 9px; top: 8px; width: 15px; height: 15px; border-radius: 50%; background: var(--nhan-nen); color: var(--nhan); font-size: .68rem; font-weight: 700; display: grid; place-items: center; line-height: 1; }
.luu-y li.on::before { content: "\2713"; }
.bang-ke { display: grid; font-size: .8rem; }
.bang-ke .dong { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 2px; border-bottom: 1px solid var(--ke); }
.bang-ke .sl { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; color: var(--nhan); }
.bang-ke .ten small { display: block; color: var(--muc3); font-size: .72rem; }
.bang-ke .gia { white-space: nowrap; font-variant-numeric: tabular-nums; color: var(--muc2); font-size: .76rem; }
@media (prefers-reduced-motion: no-preference) { .can-canh { transition: opacity .35s ease, visibility .35s; } }
@media (prefers-reduced-motion: no-preference) { .lop { transition: opacity .35s ease; } }
#c-doi { position: absolute; top: 54%; width: 22%; height: 33%; pointer-events: none; }
#c-hoa { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.song { position: absolute; width: 90px; height: 24px; margin: -12px 0 0 -45px; border-radius: 50%; border: 2px solid #E9CB94; opacity: 0; pointer-events: none; }
@media (prefers-reduced-motion: no-preference) { .song.chay { animation: song .55s ease-out; } }
@keyframes song { from { opacity: .95; transform: scale(.5); } to { opacity: 0; transform: scale(1.7); } }
.huy { position: absolute; top: 10px; right: 10px; width: 78px; height: 78px; border-radius: 50%; border: 3px solid rgba(255,255,255,.9); background: linear-gradient(180deg, #F7F1E4, #DDE7DB); box-shadow: 0 10px 22px -8px rgba(18,38,28,.5), 0 0 0 1.5px var(--champagne); display: none; }
.app.gan .huy { display: block; }
.app.gan.can-mat .huy { width: min(44%, 210px); height: auto; aspect-ratio: 1; }
@media (prefers-reduced-motion: no-preference) { .huy { transition: width .35s var(--em); } }
.tren-san { position: absolute; display: none; pointer-events: none; z-index: 2; }
.app.gan .tren-san { display: flex; }
.chon-ai { left: 10px; right: 10px; bottom: 10px; justify-content: space-between; gap: 8px; }
/* Giọt kính đứng ngay trên cảnh: vùng nhỏ nên làm mờ trực tiếp */
.chon-ai button, .xx { pointer-events: auto; border: 0; background: linear-gradient(135deg, rgba(255,255,255,.82), rgba(255,255,255,.62)); -webkit-backdrop-filter: blur(10px) saturate(1.5); backdrop-filter: blur(10px) saturate(1.5);
  color: #12261C; border-radius: 18px; padding: 5px 14px; cursor: pointer; display: grid; text-align: left; line-height: 1.2; min-height: 44px; align-content: center;
  box-shadow: 0 12px 22px -14px rgba(18,44,66,.6), inset 0 0 0 1px rgba(255,255,255,.6), inset 0 1.5px 0 rgba(255,255,255,.95); }
.chon-ai small { font-size: .62rem; letter-spacing: .08em; text-transform: uppercase; color: #40574A; }
.chon-ai b { font-size: .86rem; font-weight: 700; }
.chon-ai button[aria-pressed="true"] { background: linear-gradient(180deg, rgba(40,104,76,.96), rgba(14,50,36,.98)); color: #FBF7EE; box-shadow: 0 14px 24px -12px rgba(12,46,32,.8), inset 0 0 0 1px rgba(231,207,155,.6), inset 0 1px 0 rgba(255,255,255,.4); }
.chon-ai button[aria-pressed="true"] small { color: #E7CF9B; }
.xx-hop { left: 10px; top: 10px; }
.xx { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: .8rem; padding: 5px 14px 5px 10px; border-radius: 999px; }
.bien-canh { position: absolute; left: 12px; top: 12px; z-index: 2; display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 9px; border-radius: 999px; font-size: .78rem; font-weight: 600; color: #12261C;
  background: linear-gradient(135deg, rgba(255,255,255,.84), rgba(255,255,255,.64)); -webkit-backdrop-filter: blur(10px) saturate(1.5); backdrop-filter: blur(10px) saturate(1.5); box-shadow: inset 0 0 0 1px rgba(255,255,255,.6), 0 10px 20px -14px rgba(18,44,66,.6); }
.bien-canh .ico { width: 16px; height: 16px; color: #765225; }
.app.gan .bien-canh, .bien-canh:empty { display: none; }

/* Chỉ số: một hàng mỏng (tiền nằm ở ví trên cùng) */
.chiso { display: none; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; background: var(--tam); box-shadow: var(--bong-tam), var(--vanh); border-radius: 16px; padding: 7px 12px 8px; min-width: 0; }
.app:not([data-man="mo"]):not([data-man="doi"]):not([data-man="lop"]) .chiso { display: grid; }
.app[data-man="lop"] .vi { visibility: hidden; }
.cs { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 5px; row-gap: 4px; font-size: .72rem; color: var(--muc2); min-width: 0; }
.cs .nh { display: grid; } .cs .nh .ico { width: 15px; height: 15px; }
.cs .ten { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .cs .ngan { display: none; }
.cs .so { white-space: nowrap; }
.cs b { color: var(--muc); font-size: .88rem; font-variant-numeric: tabular-nums; }
.cs .doi { font-style: normal; font-size: .62rem; font-weight: 700; margin-left: 2px; }
.cs .doi.len { color: var(--tot); } .cs .doi.xuong { color: var(--xau); }
.cs .thanh { grid-column: 1 / -1; height: 3px; border-radius: 2px; background: var(--ke2); overflow: hidden; }
.cs .thanh i { display: block; height: 100%; border-radius: 2px; transition: width .5s var(--em); }
@media (max-width: 899px) { .app { gap: 8px; } .tien-do .chuong { display: none; } .buoc button { width: 8px; height: 8px; } .buoc [aria-current="step"] { width: 20px; }
  .chiso { gap: 10px; padding: 6px 12px 6px; } .cs { grid-template-columns: minmax(0, 1fr) auto; row-gap: 1px; } .cs .day, .cs .nh { display: none; } .cs .ngan { display: inline; }
  .cs .so { display: contents; } .cs b { grid-column: 2; grid-row: 1; justify-self: end; } .cs .doi { grid-column: 2; grid-row: 2; justify-self: end; margin: 0; font-size: .58rem; line-height: 10px; min-height: 10px; } .cs .thanh { grid-column: 1; grid-row: 2; align-self: center; } }

/* Kế hoạch của hai bạn: chỉ hiện trên màn rộng, dưới sân khấu */
.ke-hoach { display: none; background: var(--tam); box-shadow: var(--bong-tam), var(--vanh); border-radius: 22px; padding: 12px 14px; gap: 2px; min-width: 0; }
@media (min-width: 900px) { .ke-hoach:not([hidden]) { display: grid; } }
.ke-hoach h3 { margin: 0 0 4px; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--nhan); font-weight: 700; }
.ke-hoach button { display: grid; grid-template-columns: 26px 9.5em minmax(0, 1fr); gap: 8px; align-items: center; border: 0; background: transparent; text-align: left; padding: 5px 6px; border-radius: 12px; cursor: pointer; font-size: .84rem; }
.ke-hoach button:disabled { cursor: default; }
.ke-hoach button[aria-current="step"] { background: var(--nhan-nen); }
.ke-hoach .ico { width: 18px; height: 18px; color: var(--nhan); }
.ke-hoach .ten { color: var(--muc3); }
.ke-hoach .gt { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ke-hoach .cho .gt { font-weight: 400; color: var(--muc3); }

/* TẤM: bảng màn chơi */
.bang { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; background: var(--tam); border-radius: 28px; min-height: 0; min-width: 0; overflow: hidden; box-shadow: var(--bong-tam), var(--vanh); }
